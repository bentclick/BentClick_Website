# Local development services.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bentclick
      POSTGRES_PASSWORD: bentclick
      POSTGRES_DB: bentclick
    ports: ["127.0.0.1:55462:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # S3-compatible stand-in for Cloudflare R2 in local development
  # (point R2_ENDPOINT at it). Accepts any credentials; never used in production.
  storage:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: bentclick-media
    ports: ["127.0.0.1:59090:9090"]

volumes:
  pgdata:
